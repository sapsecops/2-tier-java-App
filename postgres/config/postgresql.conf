# Custom PostgreSQL configuration

listen_addresses = '*'
port = 5432
max_connections = 100

# Logging
logging_collector = on
log_statement = 'all'
log_directory = 'log'
log_filename = 'postgresql.log'

# Data locale/timezone
timezone = 'UTC'

# Include pg_hba.conf
hba_file = '/etc/postgresql/pg_hba.conf'
